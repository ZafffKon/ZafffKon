name: GitHub-Profile-Summary-Cards

on:
  schedule:
    # Setiap hari pukul 00:00 UTC (07:00 WIB)
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-summary-cards.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Token pribadi (secret) agar kontribusi repo private ikut terhitung;
          # jika secret belum ada, memakai token bawaan (hanya data publik).
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || github.token }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          TIME_ZONE: "Asia/Jakarta"
          THEME: "tokyonight"
          AUTO_PUSH: true
